# Every number the decision engine uses. Served at GET /v1/assumptions (step 7) and shown in the UI.
# PLACEHOLDER HEURISTICS: transparent assumptions, not fitted to data. Calibrate if real delay data exists.
status: "placeholder heuristics, not fitted or validated"

grid:                    # departure times simulated per mode, relative to the base (no-weather) duration
  step_min: 5
  earliest_mult: 2.5     # earliest departure = deadline - 2.5 * base - pad
  latest_mult: 0.75      # latest departure   = deadline - 0.75 * base
  pad_min: 15

noise:                   # multiplicative lognormal traffic noise, median 1: exp(N(0, sigma))
  n_draws: 40
  sigma: { walk: 0.05, bike: 0.07, drive: 0.12 }

speed:
  min_factor: 0.25       # weather never slows anything below 25% of base speed

bike:
  k_rain: 0.08           # speed lost per mm/h of rain
  rain_cap: 0.40
  k_headwind: 0.04       # speed lost per m/s of headwind above the threshold
  headwind_threshold_ms: 2.0
  headwind_cap: 0.40
  ice_threshold_c: 1.0
  ice_penalty: 0.70

drive:
  k_rain: 0.03
  rain_cap: 0.25
  gust_threshold_ms: 15.0
  k_gust: 0.015
  gust_cap: 0.20
  visibility_good_m: 2000
  visibility_floor: 0.60

walk:
  k_rain: 0.02
  rain_cap: 0.15

rail:                    # Real GB timetable where we have it (data/rail_timetable.json), else a generated one.
                         # Delays are always SIMULATED (blueprint 5.4), calibrated to published punctuality.
  station_radius_m: 3000 # use the real timetable only if both ends are this close to a timetable station
  headway_min: 15        # generated timetable only
  # Average scheduled speed by trip length, linear in between and flat beyond the ends. Short trips stop
  # more often, so they average less. Rail distance is approximated by the road distance.
  speed_table_km_kmh: [[20, 50], [80, 90], [250, 92], [600, 135]]
  timezone: Europe/London
  # Trains leave only inside this local window, on the day of the deadline: no overnight journeys
  # (there is no sleeper in the mock), so a trip that needs an earlier train is simply not possible by rail.
  first_departure: "05:30"
  last_departure: "23:30"
  access_min: 12         # door to platform
  egress_min: 8          # platform to destination
  # Calibration: in calm weather, P(arrive within 5 min of schedule) should be the published PPM. With the
  # lognormal below, P(delay <= 5 min | delayed) = 0.410, so p_on_time_base = (0.865 - 0.410) / (1 - 0.410).
  calm_within_5min_target: 0.865
  calm_target_sources:
    - "Edinburgh-Glasgow PPM 89.1, 86.6, 85.6, 84.8% (years to Mar 2017-2020): https://www.gov.scot/publications/foi-202100260453/"
    - "National on time within 3 min 85.0% (Apr-Jun 2026): https://dataportal.orr.gov.uk/statistics/performance/passenger-rail-performance/"
  p_on_time_base: 0.771  # chance a train runs without a delay
  delay_median_min: 6
  delay_sigma: 0.8       # lognormal spread of delay length
  delay_cap_min: 45
  gust_threshold_ms: 15.0
  k_gust: 0.02           # extra delay probability per m/s of gust above the threshold
  max_delay_prob: 0.9

emissions:               # REAL: UK Government GHG conversion factors 2026 (DESNZ, published June 2026)
  source: "UK Government GHG conversion factors for company reporting 2026 (DESNZ)"
  url: "https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026"
  licence: "Open Government Licence v3.0"
  # kg CO2e per km travelled by one person. Car: 'Average car, unknown fuel' 0.26699 kg/mile / 1.609344,
  # one occupant. Train: 'National rail' per passenger km, applied to the road distance (a close proxy).
  kg_co2e_per_km: { walk: 0.0, bike: 0.0, drive: 0.16590, train: 0.03092 }

traffic:                 # TomTom (only when TOMTOM_API_KEY is set; otherwise free-flow OSRM car times)
  live_window_h: 2       # trips leaving within this window use live traffic and incidents; later ones use
                         # TomTom's predicted traffic for that departure time
  simulated_incident_delay_min: 15  # DEMO ONLY: the 'Simulate an accident' switch adds this to the car

storm_demo:              # DEMO SCENARIO ONLY ("Simulate a stormy morning"): fixed changes applied to every
                         # forecast member before the engine runs. Never the real forecast; always labelled Simulated.
  rain_add_mm_h: 3.0     # moderate to heavy rain on top of whatever the forecast says
  wind_add_ms: 6.0
  gust_add_ms: 12.0      # gusts well above the 15 m/s threshold that slows cars and raises train delay risk
  visibility_cap_m: 800  # murky, spray-filled roads
